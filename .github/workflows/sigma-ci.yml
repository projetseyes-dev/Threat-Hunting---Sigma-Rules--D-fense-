name: Sigma Detection CI

on:
  push:
    branches: [main, develop]
    paths:
      - "detections/**"
      - "playbooks/**"
      - "samples/**"
      - "scripts/**"
      - "validate_sigma.py"
      - "requirements.txt"
      - ".github/workflows/sigma-ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yamllint
        run: pip install --quiet yamllint==1.35.1

      - name: Lint Sigma rules
        run: |
          cat > .yamllint <<'EOF'
          extends: default
          rules:
            new-lines: disable
            line-length:
              max: 200
              level: warning
            comments-indentation: disable
            document-start: disable
            truthy:
              check-keys: false
            indentation:
              spaces: 2
              indent-sequences: true
          EOF
          yamllint -c .yamllint detections/

  validate-sigma:
    name: Validate Sigma schema
    runs-on: ubuntu-latest
    needs: lint-yaml
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run schema validator (strict)
        run: python scripts/validate_sigma.py --strict

  sigma-preflight:
    name: Sigma CLI preflight (plugins + inputs)
    runs-on: ubuntu-latest
    needs: validate-sigma
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install sigma-cli + backends
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install sigma-cli==1.0.4 \
                      pysigma-backend-splunk \
                      pysigma-backend-kusto \
                      pysigma-pipeline-windows

      - name: Verify required sigma plugins (fail-fast)
        run: |
          set -euo pipefail
          sigma plugin list --compatible > sigma_plugins.txt
          cat sigma_plugins.txt
          grep -Eiq 'splunk' sigma_plugins.txt || { echo "[ERROR] Missing sigma splunk backend/plugin"; exit 1; }
          grep -Eiq 'kusto' sigma_plugins.txt || { echo "[ERROR] Missing sigma kusto backend/plugin"; exit 1; }

      - name: Verify detection files exist (fail-fast)
        run: |
          set -euo pipefail
          test -d detections || { echo "[ERROR] detections/ folder missing"; exit 1; }
          COUNT=$(find detections -type f -name "sigma_rule.y*ml" | wc -l | tr -d ' ')
          echo "Detected sigma_rule files: $COUNT"
          test "$COUNT" -gt 0 || { echo "[ERROR] No sigma_rule.yml files found in detections/"; exit 1; }

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigma-preflight-report
          path: sigma_plugins.txt
          retention-days: 14

  convert-splunk:
    name: Convert Sigma -> Splunk SPL
    runs-on: ubuntu-latest
    needs: sigma-preflight
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install sigma-cli + splunk backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install sigma-cli==1.0.4 \
                      pysigma-backend-splunk \
                      pysigma-pipeline-windows

      - name: Convert detections to SPL (capture logs)
        run: |
          set -euo pipefail
          mkdir -p build/logs
          python convert_rules.py detections/ --targets splunk --out build/ | tee build/logs/convert_splunk.log

      - name: Upload SPL artifacts + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splunk-conversion-artifacts
          path: |
            build/splunk/
            build/conversion_report.md
            build/logs/convert_splunk.log
          retention-days: 30

  convert-sentinel:
    name: Convert Sigma -> Sentinel KQL (kusto)
    runs-on: ubuntu-latest
    needs: sigma-preflight
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install sigma-cli + kusto backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install sigma-cli==1.0.4 \
                      pysigma-backend-kusto \
                      pysigma-pipeline-windows

      - name: Convert detections to KQL (capture logs)
        run: |
          set -euo pipefail
          mkdir -p build/logs
          python convert_rules.py detections/ --targets kusto --out build/ | tee build/logs/convert_sentinel.log

      - name: Upload KQL artifacts + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-conversion-artifacts
          path: |
            build/sentinel/
            build/conversion_report.md
            build/logs/convert_sentinel.log
          retention-days: 30

  convert-quality-gate:
    name: Conversion quality gate
    runs-on: ubuntu-latest
    needs: [convert-splunk, convert-sentinel]
    steps:
      - name: Enforce both backend conversions succeeded
        run: |
          set -euo pipefail
          echo "Both conversion jobs succeeded. Gate passed."

  generate-coverage:
    name: Generate ATT&CK Navigator layer
    runs-on: ubuntu-latest
    needs: validate-sigma
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Navigator layer
        run: |
          python generate_navigator_layer.py detections/ \
            --out coverage/attack_navigator_layer.json \
            --name "SOC Detection Coverage - ${GITHUB_REF_NAME}"

      - name: Upload coverage layer
        uses: actions/upload-artifact@v4
        with:
          name: attack-navigator-layer
          path: coverage/attack_navigator_layer.json
          retention-days: 90

  pr-summary:
    name: PR comment with coverage
    runs-on: ubuntu-latest
    needs: [validate-sigma, generate-coverage]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build summary
        id: summary
        run: |
          python generate_navigator_layer.py detections/ \
            --out /tmp/layer.json --name "PR ${{ github.event.number }}"
          {
            echo "summary<<EOF"
            echo "## Couverture ATT&CK"
            echo ""
            python -c "import json; d=json.load(open('/tmp/layer.json')); print(f\"- Règles : **{d['metadata'][1]['value']}**\"); print(f\"- Techniques couvertes : **{d['metadata'][2]['value']}**\"); print(); [print(f\"  - {t['techniqueID']} (score={t['score']})\") for t in d['techniques']]"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.summary.outputs.summary }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Couverture ATT&CK'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
