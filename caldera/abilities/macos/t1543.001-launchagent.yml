- id: 6e7f8a9b-0c1d-4e2f-9a3b-4c5d6e7f8a9b
  name: T1543.001 - User-scope LaunchAgent persistence
  description: |
    Crée un LaunchAgent dans ~/Library/LaunchAgents/ qui exécute /bin/sh.
    Reproduit la signature des stealers macOS (Atomic, RustBucket).
  tactic: persistence
  technique:
    attack_id: T1543.001
    name: Launch Agent
  platforms:
    darwin:
      sh:
        command: |
          PLIST="$HOME/Library/LaunchAgents/com.caldera.t1543.plist"
          cat > "$PLIST" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>com.caldera.t1543</string>
            <key>ProgramArguments</key>
            <array>
              <string>/bin/sh</string>
              <string>-c</string>
              <string>echo caldera_t1543 $(date) >> /tmp/caldera_t1543.log</string>
            </array>
            <key>RunAtLoad</key><true/>
          </dict>
          </plist>
          EOF
          launchctl load "$PLIST" 2>/dev/null || launchctl bootstrap gui/$(id -u) "$PLIST"
        cleanup: |
          PLIST="$HOME/Library/LaunchAgents/com.caldera.t1543.plist"
          launchctl unload "$PLIST" 2>/dev/null
          launchctl bootout gui/$(id -u)/com.caldera.t1543 2>/dev/null
          rm -f "$PLIST" /tmp/caldera_t1543.log
        timeout: 30
