          - PowerShell EID 4103 (Module Logging)
        available_for_data_analytics: true
        comment: "Script Block Logging activé GPO. Transcription sur Tier 0."
        data_quality:
          device_completeness: 5
          data_field_completeness: 5
          timeliness: 5
          consistency: 5
          retention: 4

  - data_source_name: Logon Session
    data_source:
      - applicable_to:
          - Windows Servers
          - Windows Workstations
