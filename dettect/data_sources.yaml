version: 1.2
file_type: data-source-administration
name: SOC Detection Engineering — Data Source Coverage
domain: enterprise-attack
systems:
  - applicable_to:
      - Windows Servers
      - Windows Workstations
    description: Endpoints Windows joints au domaine, configurés Sysmon + WEC.
    platform:
      - Windows
  - applicable_to:
      - Linux Servers
    description: Serveurs Linux Production (RHEL, Ubuntu, Debian).
    platform:
      - Linux
  - applicable_to:
      - AWS Cloud Infrastructure
    description: Comptes AWS multi-tenants avec CloudTrail multi-region + organization trail.
    platform:
      - IaaS

data_sources:
  - data_source_name: Process Creation
    data_source:
      - applicable_to:
          - Windows Servers
          - Windows Workstations
        date_registered: 2026-01-15
        date_connected: 2026-02-01
        products:
          - Sysmon EID 1
          - Windows Security 4688
        available_for_data_analytics: true
        comment: "Process command line auditing activé via GPO."
        data_quality:
          device_completeness: 4
          data_field_completeness: 5
          timeliness: 5
          consistency: 5
          retention: 4
      - applicable_to:
          - Linux Servers
        date_registered: 2026-03-01
        date_connected: 2026-03-15
        products:
          - auditd execve
          - osquery process_events
        available_for_data_analytics: true
        comment: "Règles auditd custom pour execve, fork, clone."
        data_quality:
          device_completeness: 3
          data_field_completeness: 4
          timeliness: 5
          consistency: 4
          retention: 4

  - data_source_name: Process Access
    data_source:
      - applicable_to:
          - Windows Servers
          - Windows Workstations
        date_registered: 2026-01-15
        date_connected: 2026-02-01
        products:
          - Sysmon EID 10
        available_for_data_analytics: true
        comment: "EID 10 actif uniquement sur Tier 0 + DCs (volume contrôlé)."
        data_quality:
          device_completeness: 3
          data_field_completeness: 5
          timeliness: 5
          consistency: 5
          retention: 3

  - data_source_name: Command Execution
