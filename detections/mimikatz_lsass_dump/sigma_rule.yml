title: Mimikatz / LSASS Dump — Suspicious Memory Access to lsass.exe
id: 3c2b1a90-8d76-4c5b-9a2e-1f0d9c8b7a6e
status: experimental
description: |
  Détecte une tentative de dump de LSASS via **accès mémoire suspect** (Sysmon
  EventID 10 - ProcessAccess) vers `lsass.exe` avec des flags `GrantedAccess`
  typiques. La règle augmente la précision en recherchant des sources
  d'outils de dumping (rundll32/procdump/taskmgr) et/ou une signature de dump
  via `CallTrace` (ex: MiniDumpWriteDump / comsvcs.dll).
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://blog.f-secure.com/detecting-lsass-dump-via-comsvcs-dll/
author: SOC Detection Engineering Team
date: 2026/04/29
modified: 2026/04/29
tags:
  - attack.credential_access
  - attack.t1003
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access_mask:
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143A'
      - '0x1FFFFF'
      - '0x101010'
      - '0x1F1FFF'
      - '0x1F2FFF'
      - '0x1F3FFF'
  selection_dump_tools:
    SourceImage|endswith:
      - '\rundll32.exe'
      - '\procdump.exe'
      - '\taskmgr.exe'
  selection_calltrace_minidump:
    CallTrace|contains:
      - 'MiniDumpWriteDump'
      - 'comsvcs.dll'
  filter_legit_edr_sources:
    SourceImage|contains:
      - '\Program Files\Windows Defender\'
      - '\Program Files\CrowdStrike\'
      - '\Program Files\SentinelOne\'
      - '\Program Files\Cybereason\'
      - '\Program Files\Carbon Black\'
  condition: selection_target and selection_access_mask and (selection_dump_tools or selection_calltrace_minidump) and not filter_legit_edr_sources
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
  - CallTrace
  - User
falsepositives:
  - Diagnostics admin manuels utilisant ProcDump/Task Manager
  - Scripts EDR en audit (à allowlister par hash ou par hôte)
level: critical
