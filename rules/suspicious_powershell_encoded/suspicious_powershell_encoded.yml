title: Suspicious PowerShell - Encoded Command and Obfuscation Patterns
id: c8d1e3a5-4f29-4a6b-bc52-1e7d3f8b9c47
status: experimental
description: |
  Détecte l'exécution de PowerShell avec des paramètres d'obfuscation classiques
  (T1059.001 / T1027) : -EncodedCommand, -ExecutionPolicy Bypass, -WindowStyle
  Hidden, téléchargement et exécution en mémoire (DownloadString / IEX), ou
  invocations indirectes typiques (FromBase64String, .Invoke()). Couvre les
  loaders Cobalt Strike, Empire, PoshC2, Nishang, et nombreuses chaînes de
  phishing.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
  - https://github.com/SigmaHQ/sigma/tree/master/rules/windows/process_creation
  - https://www.mandiant.com/resources/blog/powershell-obfuscation
author: SOC Detection Engineering Team
date: 2026/04/29
modified: 2026/04/29
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1059
  - attack.t1059.001
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\powershell_ise.exe'
  selection_encoded_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand'
      - ' -e '
      - ' -ec '
      - ' /enc '
      - ' /e '
  selection_bypass:
    CommandLine|contains:
      - 'Bypass'
      - '-nop '
      - '-NoProfile'
      - '-WindowStyle Hidden'
      - '-w hidden'
      - '-ep bypass'
      - '-ExecutionPolicy unrestricted'
  selection_download_iex:
    CommandLine|contains:
      - 'DownloadString'
      - 'DownloadFile'
      - 'Invoke-WebRequest'
      - 'Net.WebClient'
      - 'IEX('
      - 'Invoke-Expression'
      - 'iwr '
      - 'curl '
  selection_inmemory:
    CommandLine|contains:
      - 'FromBase64String'
      - '[Reflection.Assembly]::Load'
      - '[System.Reflection.Assembly]::Load'
      - 'System.Net.Sockets.TCPClient'
      - 'IO.Compression.GzipStream'
  filter_legit_paths:
    ParentImage|contains:
      - '\Windows\CCM\CcmExec.exe'
      - '\Microsoft Monitoring Agent\'
      - '\Program Files\WindowsPowerShell\Modules\'
  condition: selection_image and (selection_encoded_flag or (selection_bypass and (selection_download_iex or selection_inmemory))) and not filter_legit_paths
fields:
  - Image
  - ParentImage
  - CommandLine
  - User
  - IntegrityLevel
  - Hashes
falsepositives:
  - Outils d'administration internes (SCCM, packagers logiciels) — à profiler
  - Scripts d'audit / inventaire signés et déployés par l'IT
  - Solutions PAM utilisant des sessions PowerShell encodées
level: high
