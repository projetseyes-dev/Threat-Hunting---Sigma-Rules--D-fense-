title: Linux Reverse Shell - Suspicious Network Redirection from Shell
id: 4d2e7b91-8a3c-4f5d-9e6b-1c2d3e4f5a78
status: experimental
description: |
  Détecte la création d'un reverse shell sur Linux (T1059.004) via les
  patterns classiques : redirection /dev/tcp depuis bash, exec via socket,
  utilisation de nc/ncat/socat avec -e ou -c, ou one-liners Python/Perl/Ruby
  ouvrant un socket et dup2 vers /bin/sh. Couvre les implants exécutés via
  exploit web, RCE, post-compromise.
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/Methodology%20and%20Resources/Reverse%20Shell%20Cheatsheet.md
  - https://gtfobins.github.io/
author: SOC Detection Engineering Team
date: 2026/04/29
modified: 2026/04/29
tags:
  - attack.execution
  - attack.command_and_control
  - attack.t1059
  - attack.t1059.004
  - attack.t1071
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_bash_devtcp:
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/zsh'
    CommandLine|contains:
      - '/dev/tcp/'
      - '/dev/udp/'
  selection_nc_exec:
    Image|endswith:
      - '/nc'
      - '/ncat'
      - '/netcat'
      - '/socat'
    CommandLine|contains:
      - ' -e '
      - ' -c '
      - 'exec:'
      - 'EXEC:'
  selection_scripting_socket:
    Image|endswith:
      - '/python'
      - '/python2'
      - '/python3'
      - '/perl'
      - '/ruby'
      - '/php'
      - '/node'
    CommandLine|contains|all:
      - 'socket'
    CommandLine|contains:
      - 'connect'
      - 'AF_INET'
      - 'dup2'
      - '/bin/sh'
      - '/bin/bash'
  selection_pty_spawn:
    CommandLine|contains:
      - 'pty.spawn'
      - 'os.system("sh")'
      - "os.system('sh')"
  filter_legit_admin:
    User: 'root'
    ParentImage|endswith:
      - '/sshd'
      - '/cron'
      - '/systemd'
    CommandLine|contains:
      - 'ansible'
      - 'puppet'
  condition: (selection_bash_devtcp or selection_nc_exec or selection_scripting_socket or selection_pty_spawn) and not filter_legit_admin
fields:
  - Image
  - ParentImage
  - CommandLine
  - User
  - Tty
falsepositives:
  - Outils d'administration légitimes utilisant nc pour transferts internes
  - Tests pentest planifiés (à mettre en allowlist temporaire avec horodatage)
  - Healthcheck applicatifs ouvrant des sockets de monitoring
level: high
