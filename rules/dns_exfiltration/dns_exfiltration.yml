title: DNS Exfiltration - Long Subdomains and High Query Volume
id: 5b8c2e44-3fa1-4d6c-9e7b-8a1f2d3c4e05
status: experimental
description: |
  Détecte une exfiltration de données via le protocole DNS (T1048.003 / T1071.004)
  caractérisée par des sous-domaines anormalement longs (encodage base32/base64
  des données), une fréquence élevée de requêtes vers le même domaine parent,
  et/ou des QType inhabituels (TXT, NULL). Cible les outils tels que dnscat2,
  iodine, DNSStager, Cobalt Strike DNS beacon.
references:
  - https://attack.mitre.org/techniques/T1048/003/
  - https://attack.mitre.org/techniques/T1071/004/
  - https://github.com/iagox86/dnscat2
  - https://unit42.paloaltonetworks.com/dns-tunneling-how-dns-can-be-abused-by-malicious-actors/
author: SOC Detection Engineering Team
date: 2026/04/29
modified: 2026/04/29
tags:
  - attack.exfiltration
  - attack.command_and_control
  - attack.t1048
  - attack.t1048.003
  - attack.t1071
  - attack.t1071.004
logsource:
  product: windows
  category: dns_query
detection:
  long_subdomain:
    QueryName|re: '^[a-zA-Z0-9+/=_-]{50,}\..+\.[a-z]{2,10}$'
  suspicious_qtype:
    QueryType:
      - 'TXT'
      - 'NULL'
      - 'CNAME'
  high_entropy_pattern:
    QueryName|re: '^[A-Za-z0-9]{30,}\..+'
  filter_legit_domains:
    QueryName|endswith:
      - '.akamai.net'
      - '.akamaiedge.net'
      - '.cloudfront.net'
      - '.azureedge.net'
      - '.windowsupdate.com'
      - '.office.com'
      - '.office365.com'
      - '.googleusercontent.com'
      - '.gstatic.com'
      - '.amazonaws.com'
      - '.fastly.net'
      - '.cdn.mozilla.net'
      - '._tcp.local'
      - '._udp.local'
  filter_dnssec:
    QueryName|contains:
      - 'dnskey.'
      - 'dnssec.'
  condition: (long_subdomain or (high_entropy_pattern and suspicious_qtype)) and not (filter_legit_domains or filter_dnssec)
fields:
  - QueryName
  - QueryType
  - Image
  - User
  - DestinationIp
falsepositives:
  - CDN avec hashes longs en sous-domaine (Akamai, CloudFront) — déjà filtrés
  - Solutions antivirus / EDR utilisant DNS pour reputation lookup
  - Outils mDNS / Bonjour
  - Services SaaS legitimes utilisant des tokens dans les sous-domaines
level: high
