title: Credential Dumping - Suspicious LSASS Process Access
id: 9d4e2c87-1b6a-4f3e-a5c2-7b8e9d4f1a23
status: experimental
description: |
  Détecte les accès suspects au processus lsass.exe (T1003.001) via Sysmon EID 10
  (ProcessAccess), caractéristiques d'un dump de credentials par Mimikatz, ProcDump,
  comsvcs.dll MiniDump, taskmgr en mode élevé, ou outils customs (nanodump,
  pypykatz, dumpert). La règle s'appuie sur les GrantedAccess flags utilisés
  pour appeler MiniDumpWriteDump (0x1010, 0x1410, 0x1438, 0x143A, 0x1FFFFF).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: SOC Detection Engineering Team
date: 2026/04/29
modified: 2026/04/29
tags:
  - attack.credential_access
  - attack.t1003
logsource:
  product: windows
  category: process_access
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access_mask:
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143A'
      - '0x1FFFFF'
      - '0x101010'
      - '0x1F1FFF'
      - '0x1F2FFF'
      - '0x1F3FFF'
  filter_legit_av:
    SourceImage|endswith:
      - '\MsMpEng.exe'
      - '\MsSense.exe'
      - '\NisSrv.exe'
      - '\smartscreen.exe'
      - '\WerFault.exe'
      - '\csrss.exe'
      - '\wininit.exe'
      - '\services.exe'
  filter_signed_edr:
    SourceImage|contains:
      - '\Program Files\Windows Defender\'
      - '\Program Files\CrowdStrike\'
      - '\Program Files\SentinelOne\'
      - '\Program Files\Cybereason\'
      - '\Program Files\Carbon Black\'
  condition: selection_target and selection_access_mask and not (filter_legit_av or filter_signed_edr)
fields:
  - SourceImage
  - SourceProcessId
  - TargetImage
  - GrantedAccess
  - CallTrace
  - User
falsepositives:
  - Solutions EDR/AV non encore allowlistées
level: critical

